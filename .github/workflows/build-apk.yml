name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Siapkan Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependensi & build web Vite
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Tambahkan platform Android & sinkronisasi Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Kompilasi Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Unggah file APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peta-Kabupaten-Bekasi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
